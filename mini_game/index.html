<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Cyber Dodge 🚀</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #0d0e15;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #00f3ff;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #1a1c2e 0%, #090a10 100%);
        }
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 8px #00f3ff;
        }
        .score-val { color: #00f3ff; }
        .high-val { color: #ff007f; }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 14, 21, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 32px;
            color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p { margin-bottom: 20px; color: #a0a5c0; font-size: 14px; line-height: 1.5; }
        .btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
        }
        .btn:active { transform: scale(0.98); }
        .controls-hint {
            margin-top: 15px;
            font-size: 12px;
            color: #707595;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="canvas" width="400" height="600"></canvas>
        <div class="ui-layer">
            <div class="stats-bar">
                <div>SCORE: <span id="score" class="score-val">0</span></div>
                <div>BEST: <span id="highscore" class="high-val">0</span></div>
            </div>
        </div>
        <div id="start-screen" class="overlay">
            <h1>NEON DODGE 🚀</h1>
            <p>Dodge obstacles & collect Energy Orbs!<br>Use Arrow Keys, WASD, Mouse, or Touch to move.</p>
            <button class="btn" onclick="startGame()">START GAME</button>
            <div class="controls-hint">Tip: Collect 🌟 Orbs for +100 PTS!</div>
        </div>
        <div id="game-over-screen" class="overlay hidden">
            <h1 style="color: #ff007f; text-shadow: 0 0 15px #ff007f;">GAME OVER 💥</h1>
            <p>Your Final Score: <span id="final-score" style="color: #00f3ff; font-weight: bold; font-size: 20px;">0</span></p>
            <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'collect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        let isRunning = false;
        let score = 0;
        let highscore = localStorage.getItem('neon_dodge_highscore') || 0;
        highscoreEl.innerText = highscore;

        const player = {
            x: 200,
            y: 500,
            radius: 14,
            speed: 6,
            color: '#00f3ff'
        };

        let keys = {};
        let mouseX = 200;
        let isTouch = false;

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        canvas.addEventListener('touchmove', e => {
            isTouch = true;
            const rect = canvas.getBoundingClientRect();
            player.x = e.touches[0].clientX - rect.left;
            player.y = e.touches[0].clientY - rect.top;
        }, { passive: true });

        let obstacles = [];
        let collectibles = [];
        let particles = [];
        let frameCount = 0;

        function spawnObstacle() {
            const size = Math.random() * 20 + 15;
            obstacles.push({
                x: Math.random() * (canvas.width - size * 2) + size,
                y: -size,
                radius: size,
                speed: Math.random() * 2 + 3 + (score / 500),
                color: '#ff0055',
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function spawnCollectible() {
            collectibles.push({
                x: Math.random() * (canvas.width - 30) + 15,
                y: -15,
                radius: 10,
                speed: 2.5,
                color: '#ffbe00'
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function startGame() {
            score = 0;
            scoreEl.innerText = score;
            obstacles = [];
            collectibles = [];
            particles = [];
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            isRunning = true;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isRunning = false;
            playSound('hit');
            createExplosion(player.x, player.y, '#00f3ff');
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('neon_dodge_highscore', highscore);
                highscoreEl.innerText = highscore;
            }
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        function update() {
            frameCount++;

            // Player Movement
            if (!isTouch) {
                if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
                if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
                if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
                if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
                
                // Smooth mouse follow if mouse was moved
                if (Math.abs(mouseX - player.x) > 5) {
                    player.x += (mouseX - player.x) * 0.1;
                }
            }

            // Keep in bounds
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Spawning
            if (frameCount % Math.max(20, 60 - Math.floor(score / 100)) === 0) {
                spawnObstacle();
            }
            if (frameCount % 120 === 0) {
                spawnCollectible();
            }

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.y += o.speed;
                o.rot += o.rotSpeed;

                // Collision Check
                const dist = Math.hypot(player.x - o.x, player.y - o.y);
                if (dist < player.radius + o.radius) {
                    gameOver();
                    return;
                }

                if (o.y > canvas.height + o.radius) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                }
            }

            // Update Collectibles
            for (let i = collectibles.length - 1; i >= 0; i--) {
                let c = collectibles[i];
                c.y += c.speed;

                const dist = Math.hypot(player.x - c.x, player.y - c.y);
                if (dist < player.radius + c.radius) {
                    playSound('collect');
                    createExplosion(c.x, c.y, c.color);
                    collectibles.splice(i, 1);
                    score += 100;
                    scoreEl.innerText = score;
                } else if (c.y > canvas.height + c.radius) {
                    collectibles.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid Lines (Retro Effect)
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.lineWidth = 1;
            const step = 40;
            const offset = (frameCount * 2) % step;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = offset; y < canvas.height; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Player Ship (Neon Triangle)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(0, -player.radius * 1.3);
            ctx.lineTo(-player.radius, player.radius);
            ctx.lineTo(player.radius, player.radius);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Draw Obstacles (Neon Octagons)
            obstacles.forEach(o => {
                ctx.save();
                ctx.translate(o.x, o.y);
                ctx.rotate(o.rot);
                ctx.shadowBlur = 10;
                ctx.shadowColor = o.color;
                ctx.strokeStyle = o.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i * Math.PI) / 3;
                    const px = Math.cos(angle) * o.radius;
                    const py = Math.sin(angle) * o.radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            });

            // Draw Collectibles (Glowing Orbs)
            collectibles.forEach(c => {
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = c.color;
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function gameLoop() {
            if (!isRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
